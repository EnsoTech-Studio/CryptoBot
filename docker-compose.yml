name: cryptobot

services:
  ai:
    build:
      context: ./ai
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    environment:
      PORT: "8080"
      AI_SERVICE_URL: http://ai:8000
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
