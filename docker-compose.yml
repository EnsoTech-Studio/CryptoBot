name: cryptobot

# Optional local PostgreSQL for offline development. When .env contains
# Supabase/external database URLs, backend.ps1 skips this container.
services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cryptobot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cryptobot}"
      POSTGRES_DB: "${POSTGRES_DB:-cryptobot}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-native-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-native-data:
