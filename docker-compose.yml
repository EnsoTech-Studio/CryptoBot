name: cryptobot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cryptobot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cryptobot}"
      POSTGRES_DB: "${POSTGRES_DB:-cryptobot}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai:
    build:
      context: ./ai
    environment:
      PYTHONUNBUFFERED: "1"
      SENTIMENT_MODEL_VERSION: "${SENTIMENT_MODEL_VERSION:-2026-08-01}"
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  research:
    build:
      context: .
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${RESEARCH_PORT:-8001}:8001"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-cryptobot}:${POSTGRES_PASSWORD:-cryptobot}@postgres:5432/${POSTGRES_DB:-cryptobot}?sslmode=disable"
      AI_SERVICE_URL: "http://ai:8000"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      SHUTDOWN_TIMEOUT: "10s"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
      research:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./server
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-cryptobot}:${POSTGRES_PASSWORD:-cryptobot}@postgres:5432/${POSTGRES_DB:-cryptobot}?sslmode=disable"
      AI_SERVICE_URL: "http://ai:8000"
      WORKER_ID: "worker-1"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
