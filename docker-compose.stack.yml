name: cryptobot

# Full-container topology for production-like rehearsal and deployment.
# Local development uses docker-compose.yml (PostgreSQL only) and runs the
# application services natively.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cryptobot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cryptobot}"
      POSTGRES_DB: "${POSTGRES_DB:-cryptobot}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai:
    build:
      context: ./ai
    environment:
      PYTHONUNBUFFERED: "1"
      SENTIMENT_MODEL_VERSION: "${SENTIMENT_MODEL_VERSION:-2026-08-01}"
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  migrate:
    build:
      context: .
    entrypoint: ["python", "-m", "app.migrate"]
    environment:
      MIGRATION_DATABASE_URL: "postgres://${POSTGRES_USER:-cryptobot}:${POSTGRES_PASSWORD:-cryptobot}@postgres:5432/${POSTGRES_DB:-cryptobot}?sslmode=disable"
      RESEARCH_DATABASE_USER: "${RESEARCH_DATABASE_USER:-research_service}"
      RESEARCH_DATABASE_PASSWORD: "${RESEARCH_DATABASE_PASSWORD:-research_service}"
      API_DATABASE_USER: "${API_DATABASE_USER:-api_service}"
      API_DATABASE_PASSWORD: "${API_DATABASE_PASSWORD:-api_service}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  research:
    build:
      context: .
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgres://${RESEARCH_DATABASE_USER:-research_service}:${RESEARCH_DATABASE_PASSWORD:-research_service}@postgres:5432/${POSTGRES_DB:-cryptobot}?sslmode=disable"
      AI_SERVICE_URL: "http://ai:8000"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-development-internal-token}"
      MAX_REQUEST_BYTES: "${MAX_REQUEST_BYTES:-1048576}"
    ports:
      - "${RESEARCH_PORT:-8001}:8001"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ./server
    environment:
      PORT: "8080"
      MARKET_DATABASE_URL: "postgres://${API_DATABASE_USER:-api_service}:${API_DATABASE_PASSWORD:-api_service}@postgres:5432/${POSTGRES_DB:-cryptobot}?sslmode=disable"
      JWT_PRIVATE_KEY_FILE: "/var/lib/cryptobot/jwt-private.pem"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      RESEARCH_SERVICE_URL: "http://research:8001"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-development-internal-token}"
      RESEARCH_REQUEST_TIMEOUT: "${RESEARCH_REQUEST_TIMEOUT:-15s}"
      RESEARCH_MAX_BODY_BYTES: "${RESEARCH_MAX_BODY_BYTES:-4194304}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      SHUTDOWN_TIMEOUT: "10s"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-keys:/var/lib/cryptobot
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      research:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
    entrypoint: ["python", "-m", "app.worker", "queue"]
    environment:
      DATABASE_URL: "postgres://${RESEARCH_DATABASE_USER:-research_service}:${RESEARCH_DATABASE_PASSWORD:-research_service}@postgres:5432/${POSTGRES_DB:-cryptobot}?sslmode=disable"
      WORKER_ID: "worker-1"
      WORKER_LEASE_SECONDS: "${WORKER_LEASE_SECONDS:-120}"
      WORKER_HEARTBEAT_SECONDS: "${WORKER_HEARTBEAT_SECONDS:-30}"
      EVENT_CONSUMERS: ""
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  event-worker:
    build:
      context: .
    entrypoint: ["python", "-m", "app.event_worker"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgres://${RESEARCH_DATABASE_USER:-research_service}:${RESEARCH_DATABASE_PASSWORD:-research_service}@postgres:5432/${POSTGRES_DB:-cryptobot}?sslmode=disable"
      EVENT_WORKER_ID: "events-1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  news-worker:
    build:
      context: .
    entrypoint: ["python", "-m", "app.news_worker"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgres://${RESEARCH_DATABASE_USER:-research_service}:${RESEARCH_DATABASE_PASSWORD:-research_service}@postgres:5432/${POSTGRES_DB:-cryptobot}?sslmode=disable"
      AI_SERVICE_URL: "http://ai:8000"
      AI_REQUEST_TIMEOUT_SECONDS: "${AI_REQUEST_TIMEOUT_SECONDS:-5}"
      SENTIMENT_MODEL: "${SENTIMENT_MODEL:-sentiment-v1}"
      SENTIMENT_MODEL_VERSION: "${SENTIMENT_MODEL_VERSION:-2026-08-01}"
      NEWS_COLLECTION_INTERVAL_SECONDS: "${NEWS_COLLECTION_INTERVAL_SECONDS:-900}"
      SENTIMENT_BACKFILL_INTERVAL_SECONDS: "${SENTIMENT_BACKFILL_INTERVAL_SECONDS:-60}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  agent-worker:
    build:
      context: .
    entrypoint: ["python", "-m", "app.agent_worker"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgres://${RESEARCH_DATABASE_USER:-research_service}:${RESEARCH_DATABASE_PASSWORD:-research_service}@postgres:5432/${POSTGRES_DB:-cryptobot}?sslmode=disable"
      AI_SERVICE_URL: "http://ai:8000"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-development-internal-token}"
      AGENT_WORKER_ID: "agent-worker-1"
      WORKER_LEASE_SECONDS: "${WORKER_LEASE_SECONDS:-120}"
      WORKER_HEARTBEAT_SECONDS: "${WORKER_HEARTBEAT_SECONDS:-30}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  api-keys:
