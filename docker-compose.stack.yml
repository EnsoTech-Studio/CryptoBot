name: cryptobot

# Full-container topology for production-like rehearsal and deployment.
# PostgreSQL is external (for example Supabase) and is provided through
# MIGRATION_DATABASE_URL, DATABASE_URL, and MARKET_DATABASE_URL.
services:
  ai:
    build:
      context: ./ai
    environment:
      PYTHONUNBUFFERED: "1"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-120b}"
      GROQ_BASE_URL: "${GROQ_BASE_URL:-https://api.groq.com/openai/v1}"
      GROQ_TIMEOUT_SECONDS: "${GROQ_TIMEOUT_SECONDS:-10}"
      SENTIMENT_MODEL_VERSION: "${SENTIMENT_MODEL_VERSION:-2026-08-01}"
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8

  migrate:
    build:
      context: .
    entrypoint: ["python", "-m", "app.migrate"]
    environment:
      MIGRATION_DATABASE_URL: "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}"
      RESEARCH_DATABASE_USER: "${RESEARCH_DATABASE_USER:-research_service}"
      RESEARCH_DATABASE_PASSWORD: "${RESEARCH_DATABASE_PASSWORD:-research_service}"
      API_DATABASE_USER: "${API_DATABASE_USER:-api_service}"
      API_DATABASE_PASSWORD: "${API_DATABASE_PASSWORD:-api_service}"
    restart: "no"

  research:
    build:
      context: .
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      AI_SERVICE_URL: "http://ai:8000"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-development-internal-token}"
      MAX_REQUEST_BYTES: "${MAX_REQUEST_BYTES:-1048576}"
    ports:
      - "${RESEARCH_PORT:-8001}:8001"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ./server
    environment:
      PORT: "8080"
      MARKET_DATABASE_URL: "${MARKET_DATABASE_URL:?MARKET_DATABASE_URL is required}"
      JWT_PRIVATE_KEY_FILE: "/var/lib/cryptobot/jwt-private.pem"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      RESEARCH_SERVICE_URL: "http://research:8001"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-development-internal-token}"
      RESEARCH_REQUEST_TIMEOUT: "${RESEARCH_REQUEST_TIMEOUT:-15s}"
      RESEARCH_MAX_BODY_BYTES: "${RESEARCH_MAX_BODY_BYTES:-4194304}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      SHUTDOWN_TIMEOUT: "10s"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-keys:/var/lib/cryptobot
    depends_on:
      migrate:
        condition: service_completed_successfully
      research:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
    entrypoint: ["python", "-m", "app.worker", "queue"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      WORKER_ID: "worker-1"
      WORKER_LEASE_SECONDS: "${WORKER_LEASE_SECONDS:-120}"
      WORKER_HEARTBEAT_SECONDS: "${WORKER_HEARTBEAT_SECONDS:-30}"
      EVENT_CONSUMERS: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  event-worker:
    build:
      context: .
    entrypoint: ["python", "-m", "app.event_worker"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      EVENT_WORKER_ID: "events-1"
      EVENT_LEASE_SECONDS: "${EVENT_LEASE_SECONDS:-60}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  news-worker:
    build:
      context: .
    entrypoint: ["python", "-m", "app.news_worker"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      AI_SERVICE_URL: "http://ai:8000"
      AI_REQUEST_TIMEOUT_SECONDS: "${AI_REQUEST_TIMEOUT_SECONDS:-5}"
      SENTIMENT_MODEL: "${SENTIMENT_MODEL:-sentiment-v1}"
      SENTIMENT_MODEL_VERSION: "${SENTIMENT_MODEL_VERSION:-2026-08-01}"
      NEWS_COLLECTION_INTERVAL_SECONDS: "${NEWS_COLLECTION_INTERVAL_SECONDS:-900}"
      SENTIMENT_BACKFILL_INTERVAL_SECONDS: "${SENTIMENT_BACKFILL_INTERVAL_SECONDS:-60}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  agent-worker:
    build:
      context: .
    entrypoint: ["python", "-m", "app.agent_worker"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      AI_SERVICE_URL: "http://ai:8000"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-development-internal-token}"
      AGENT_WORKER_ID: "agent-worker-1"
      WORKER_LEASE_SECONDS: "${WORKER_LEASE_SECONDS:-120}"
      WORKER_HEARTBEAT_SECONDS: "${WORKER_HEARTBEAT_SECONDS:-30}"
    volumes:
      - ./data/formatted/sol/2026-03-04:/app/data/formatted/sol/2026-03-04:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
        NEXT_PUBLIC_UI_REFERENCE_MODE: "${NEXT_PUBLIC_UI_REFERENCE_MODE:-false}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
      NEXT_PUBLIC_UI_REFERENCE_MODE: "${NEXT_PUBLIC_UI_REFERENCE_MODE:-false}"
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-keys:
