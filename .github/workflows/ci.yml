name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_architecture.py

  research-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest tests --ignore=tests/integration -q

  research-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptobot
          POSTGRES_PASSWORD: cryptobot
          POSTGRES_DB: cryptobot
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U cryptobot -d cryptobot"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://cryptobot:cryptobot@127.0.0.1:55433/cryptobot?sslmode=disable
      TEST_DATABASE_URL: postgres://cryptobot:cryptobot@127.0.0.1:55433/cryptobot?sslmode=disable
      RESEARCH_DATABASE_PASSWORD: research_service
      API_DATABASE_PASSWORD: api_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m app.migrate
      - run: pytest tests/integration -q

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server/go.sum
      - run: go test -race ./...

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [architecture, research-unit, research-postgres, go, ai, web]
    strategy:
      matrix:
        include:
          - context: .
            name: research
          - context: server
            name: api
          - context: ai
            name: ai
          - context: web
            name: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: cryptobot-${{ matrix.name }}:ci
