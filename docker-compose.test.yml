# Postgres with the blueprint design.md DDL for Python queue-mode integration
# tests. Separate from the main compose (which runs the divergent Go lab
# schema): make test-postgres up -d, then
# TEST_DATABASE_URL=postgres://cryptobot:cryptobot@localhost:55432/cryptobot?sslmode=disable
# uv run pytest tests/integration -q
services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot
      POSTGRES_DB: cryptobot
    ports:
      - "55432:5432"
    volumes:
      - ./tests/integration/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot -d cryptobot"]
      interval: 2s
      timeout: 2s
      retries: 15
