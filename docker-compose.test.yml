# Postgres with the blueprint design.md DDL for Python queue-mode integration
# tests. Separate from the main compose: docker compose -f docker-compose.test.yml up -d, then
# TEST_DATABASE_URL=postgres://cryptobot:cryptobot@127.0.0.1:55433/cryptobot?sslmode=disable
# uv run pytest tests/integration -q
name: cryptobot-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot
      POSTGRES_DB: cryptobot
    ports:
      - "${TEST_POSTGRES_PORT:-55433}:5432"
    volumes:
      - ./migrations/001_research_core.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./migrations/002_platform_and_research.sql:/docker-entrypoint-initdb.d/02_platform.sql:ro
      - ./migrations/003_integrity_and_roles.sql:/docker-entrypoint-initdb.d/03_integrity.sql:ro
      - ./migrations/004_news_market_contract_hardening.sql:/docker-entrypoint-initdb.d/04_contracts.sql:ro
      - ./migrations/005_market_reference_data.sql:/docker-entrypoint-initdb.d/05_reference_data.sql:ro
      - ./migrations/006_result_provenance.sql:/docker-entrypoint-initdb.d/06_result_provenance.sql:ro
      - ./migrations/007_deterministic_demo_dataset.sql:/docker-entrypoint-initdb.d/07_demo_dataset.sql:ro
      - ./migrations/008_research_quota_read.sql:/docker-entrypoint-initdb.d/08_quota_read.sql:ro
      - ./migrations/009_research_projection_reads.sql:/docker-entrypoint-initdb.d/09_projection_reads.sql:ro
      - ./migrations/010_research_news_projection_read.sql:/docker-entrypoint-initdb.d/10_news_projection.sql:ro
      - ./migrations/011_search_lifecycle_and_correlation.sql:/docker-entrypoint-initdb.d/11_search_lifecycle.sql:ro
      - ./migrations/012_strategy_authoring.sql:/docker-entrypoint-initdb.d/12_strategy_authoring.sql:ro
      - ./migrations/013_published_strategy_specs.sql:/docker-entrypoint-initdb.d/13_published_strategy_specs.sql:ro
      - ./migrations/014_adaptive_news_extraction.sql:/docker-entrypoint-initdb.d/14_adaptive_news_extraction.sql:ro
      - ./migrations/015_experiment_replay_range.sql:/docker-entrypoint-initdb.d/15_experiment_replay_range.sql:ro
      - ./migrations/016_strategy_artifact_hash_scope.sql:/docker-entrypoint-initdb.d/16_strategy_artifact_hash_scope.sql:ro
      - ./migrations/017_agent_attempt_audit.sql:/docker-entrypoint-initdb.d/17_agent_attempt_audit.sql:ro
      - ./migrations/018_agent_run_transitions.sql:/docker-entrypoint-initdb.d/18_agent_run_transitions.sql:ro
      - ./migrations/019_durable_agent_jobs.sql:/docker-entrypoint-initdb.d/19_agent_jobs.sql:ro
      - ./migrations/020_agent_cancellation.sql:/docker-entrypoint-initdb.d/20_agent_cancellation.sql:ro
      - ./migrations/021_agent_tool_invocations.sql:/docker-entrypoint-initdb.d/21_agent_tool_invocations.sql:ro
      - ./migrations/022_trade_cost_provenance.sql:/docker-entrypoint-initdb.d/22_trade_cost_provenance.sql:ro
      - ./migrations/023_okx_swap_market_pairs.sql:/docker-entrypoint-initdb.d/23_okx_swap_market_pairs.sql:ro
      - ./scripts/queue-scale-proof.sql:/proof/queue-scale-proof.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot -d cryptobot"]
      interval: 2s
      timeout: 2s
      retries: 15
